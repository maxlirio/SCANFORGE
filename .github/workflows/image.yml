# Build the reconstruction container and publish it to GHCR.
#
# Two jobs in one: it verifies the Dockerfile on real x86 hardware (which a
# Mac cannot do without slow emulation), and it means a Codespace just pulls a
# ready image instead of spending ten minutes building one - the failure mode
# that made "config error" so opaque.
name: Build container image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/**'
      - 'packages/**'
      - 'pipeline/**'
      - 'package*.json'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scanforge:latest
            ghcr.io/${{ github.repository_owner }}/scanforge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # conda-forge binaries can be built for a newer CPU baseline than the
      # host provides, which shows up as SIGILL. Record what we are running on
      # and which package build we got, so a failure is diagnosable.
      - name: Environment facts
        run: |
          echo "--- runner CPU ---"
          lscpu | grep -E "^Model name|^Flags" | cut -c1-400
          for f in avx avx2 avx512f sse4_2 fma; do
            grep -qw $f /proc/cpuinfo && echo "has $f" || echo "NO  $f"
          done
          echo "--- colmap package build ---"
          docker run --rm --entrypoint /bin/sh \
            ghcr.io/${{ github.repository_owner }}/scanforge:latest -c \
            'micromamba list 2>/dev/null | grep -Ei "colmap|openimageio|libboost|ceres" || true'
          echo "--- archspec the image was resolved against ---"
          docker run --rm --entrypoint /bin/sh \
            ghcr.io/${{ github.repository_owner }}/scanforge:latest -c \
            'micromamba list 2>/dev/null | grep -i "^ *__archspec" || echo "(no archspec pin recorded)"'
          echo "--- does colmap run? ---"
          docker run --rm --entrypoint /bin/sh \
            ghcr.io/${{ github.repository_owner }}/scanforge:latest -c \
            '/opt/conda/bin/colmap -h 2>&1 | head -3; echo "exit=$?"' || true

      # Prove the image actually works before anyone pulls it: COLMAP has to
      # run, and the API has to report the provider as available.
      - name: Smoke-test the image
        run: |
          docker run -d --name sf -p 7860:7860 ghcr.io/${{ github.repository_owner }}/scanforge:latest
          for i in $(seq 1 60); do
            sleep 2
            if curl -sf http://127.0.0.1:7860/api/health -o health.json; then break; fi
          done
          cat health.json | python3 -m json.tool | head -25
          python3 - <<'PY'
          import json, sys
          d = json.load(open('health.json'))
          p = next(p for p in d['providers'] if p['id'] == 'colmap-local')
          assert p['available'], f"reconstruction provider unavailable: {p.get('reason')}"
          print('colmap', p['details']['colmapVersion'], '| tier', p['details']['tier'])
          PY
          docker exec sf /opt/conda/bin/colmap -h | head -1

      # A Codespace bootstraps its editor server inside this image; missing
      # basics there fail as an unexplained "configuration error".
      - name: Check the tools a Codespace needs are present
        run: |
          # Check both a plain shell and a login shell: a login shell re-reads
          # /etc/profile, which is where the PATH to node/python is easily lost.
          for tool in curl git tar gzip bash ps node python3 colmap; do
            docker exec sf sh -c  "command -v $tool" || { echo "MISSING (sh): $tool"; exit 1; }
            docker exec sf sh -lc "command -v $tool" || { echo "MISSING (login shell): $tool"; exit 1; }
          done
